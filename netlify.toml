# Build configuration untuk Expo Router di Netlify
[build]
  # Install dependencies dan build web version
  command = "npm install && npx expo export --platform web"
  # Publish directory - output dari expo export dengan Metro bundler
  publish = "dist"

# Redirect rules untuk SPA routing
# Semua route akan di-redirect ke index.html agar client-side routing bekerja
[[redirects]]
  from = "/photos/*"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

